# ArmorIQ manifest for the AFTERMATH live runner (schema verified against armoriq-sdk 0.6.10).
# The API key is read from the environment; never paste a real key here.
version: v1
identity:
  api_key: $ARMORIQ_API_KEY
  user_id: aftermath-service
  agent_id: support-refund-agent
environment: sandbox
proxy:
  url: https://proxy.armoriq.ai
  timeout: 30
  max_retries: 3
mcp_servers:
  - id: aftermath-mcp-public
    # ArmorIQ's proxy calls the MCP itself, so this must be a public HTTPS URL
    # (see mcp_public/server.py, streamable HTTP at /mcp). Live: https://aftermath-mcp-jarvis.onrender.com/mcp
    url: https://aftermath-mcp-jarvis.onrender.com/mcp
    description: AFTERMATH Synthetic Support MCP
    auth:
      type: none
policy:
  allow:
    - aftermath-mcp-public.read_ticket_tool
    - aftermath-mcp-public.lookup_customer_tool
    - aftermath-mcp-public.issue_refund_tool
  deny:
    - aftermath-mcp-public.issue_large_refund_tool
    - aftermath-mcp-public.change_account_email_tool
intent:
  ttl_seconds: 300
  require_csrg: false
