# ArmorIQ manifest for the AFTERMATH live runner (schema verified against armoriq-sdk 0.6.10).
# The API key is read from the environment; never paste a real key here.
version: v1
identity:
  api_key: $ARMORIQ_API_KEY
  user_id: aftermath-service
  agent_id: support-refund-agent
environment: sandbox
proxy:
  url: https://proxy.armoriq.ai
  timeout: 30
  max_retries: 3
mcp_servers:
  - id: aftermath-mcp
    url: http://127.0.0.1:8000/sse
    description: AFTERMATH Synthetic Support MCP
    auth:
      type: none
policy:
  allow:
    - aftermath-mcp.read_ticket_tool
    - aftermath-mcp.lookup_customer_tool
    - aftermath-mcp.issue_refund_tool
  deny: []
intent:
  ttl_seconds: 300
  require_csrg: false
